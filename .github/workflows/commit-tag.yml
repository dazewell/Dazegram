name: Commit tag check

# Fail a PR if any authored (non-merge) commit lacks a #<slug> change tag, the
# same tag the local .githooks/commit-msg hook enforces. Keeps every commit for
# a change greppable by one token (git log --grep '#chatlock').

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Every commit carries a #tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit tags
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true
          fail=0
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Revert "*|"fixup! "*|"squash! "*|"amend! "*) continue ;;
            esac
            if git log -1 --format=%B "$sha" | grep -Eq '(^|[^A-Za-z0-9_])#([a-z][a-z0-9-]*|[0-9][a-z0-9-]*[a-z][a-z0-9-]*)'; then
              continue
            fi
            echo "::error::commit $sha is missing a #<slug> change tag: $subject"
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Every commit must carry a #tag (e.g. #chatlock) so all commits for a change are greppable."
            exit 1
          fi
          echo "All commits carry a change tag."

          # Every feature slug used in the PR must be catalogued in FEATURES.md
          # (marked with <!-- #slug -->). Category tags and *-fix tags are exempt.
          # A hashtag is only harvested as a slug if it contains at least one
          # letter, so a purely numeric hashtag such as a PR reference (#204)
          # is never treated as a feature slug requiring a FEATURES.md entry.
          # Same leading-boundary guard as the presence check above, so a URL
          # anchor glued to a word (e.g. docs#permissions) is never harvested
          # either — the match may carry that boundary character, so strip it
          # off (leaving just the slug) before deduping, not after: dedup on
          # the raw match would let e.g. "(#foo" and "#foo" survive sort -u as
          # two entries and print a duplicate ::error:: for the same slug.
          # Same --no-merges scope as the presence check above too, so a merge
          # commit's message (exempt from needing its own tag) can't smuggle
          # in a stray letter-bearing hashtag and demand a FEATURES.md entry.
          missing=0
          slugs=$(git log --no-merges --format=%B "$BASE_SHA".."$HEAD_SHA" | grep -oE '(^|[^A-Za-z0-9_])#([a-z][a-z0-9-]*|[0-9][a-z0-9-]*[a-z][a-z0-9-]*)' | while IFS= read -r match; do printf '%s\n' "${match##*#}"; done | sort -u)
          for slug in $slugs; do
            case "$slug" in
              ci|docs|build|chore|infra|deps|test|release|slug|tag|chatlock) continue ;;
              *-fix) continue ;;
            esac
            if ! grep -q "<!-- #$slug -->" FEATURES.md; then
              echo "::error::feature tag #$slug is not catalogued in FEATURES.md (add its entry with a <!-- #$slug --> marker)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All feature tags are catalogued in FEATURES.md."
