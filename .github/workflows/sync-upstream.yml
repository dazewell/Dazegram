name: Sync upstream

# Merge-forward sync onto the base fork (risin42/NagramX), never a rebase.
# base is fast-forwarded from the base fork, then dev merges base. If the merge
# conflicts the sync aborts, pushes nothing, and pings Telegram so it can be
# finished on the PC. A clean sync pushes dev, which triggers staging.yml
# (dual APK + Telegram upload).

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base-fork branch to sync onto'
        required: false
        default: 'dev'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge-forward dev onto base fork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          # PAT with `workflow` scope: the base fork ships .github/workflows
          # files, and the default GITHUB_TOKEN is refused when a push
          # creates/updates a workflow file. Falls back to GITHUB_TOKEN so a
          # clone with no workflow changes upstream still works.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add base-fork remote
        run: |
          git remote add source https://github.com/risin42/NagramX.git \
            || git remote set-url source https://github.com/risin42/NagramX.git

      - name: Fetch base fork
        run: git fetch source ${{ github.event.inputs.base_branch }}

      - name: Fast-forward base
        run: |
          BR="${{ github.event.inputs.base_branch }}"
          if git ls-remote --exit-code --heads origin base >/dev/null 2>&1; then
            git fetch origin base
            git switch -C base FETCH_HEAD
            git merge --ff-only "source/$BR"
          else
            git switch -C base "source/$BR"
          fi
          git push origin base

      - name: Merge-forward dev (conflict-guarded)
        id: merge
        run: |
          git switch dev
          PRE=$(git rev-parse HEAD)
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit base; then
            git merge --abort || true
            git reset --hard "$PRE"
            echo "conflict=base" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push dev (clean only)
        run: git push origin dev

      - name: Notify conflict
        if: failure() && steps.merge.outputs.conflict != ''
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          HELPER_BOT_TARGET: ${{ secrets.HELPER_BOT_TARGET }}
        run: |
          if [ -z "$HELPER_BOT_TOKEN" ] || [ -z "$HELPER_BOT_TARGET" ]; then
            echo "Telegram secrets unset; skipping notification."
            exit 0
          fi
          curl -s "https://api.telegram.org/bot${HELPER_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${HELPER_BOT_TARGET}" \
            --data-urlencode "text=⚠️ NagramX sync blocked: ${{ steps.merge.outputs.conflict }} conflicts with the base fork. Needs the PC." \
            >/dev/null
