name: Sync upstream

# Snapshot-mediated nbase sync onto dev.
#
# The old mechanism merged the archived risin42 base fork directly. That parent
# is gone; the live parent is NextAlone/Nagram. We never merge Nagram's history
# into dev — that would import its commits, authors and messages and re-open the
# 503-conflict merge-base. Instead:
#
#   1. take Nagram/dev's TREE at a resolved SHA,
#   2. wrap it in one locally-authored snapshot commit whose only parent is the
#      current nbase (this is the new nbase),
#   3. 3-way merge that snapshot into dev.
#
# Because nbase is an ancestor of dev (the anchor commit made it one), the merge
# base is the previous snapshot and dev gets exactly Nagram's upstream delta and
# nothing else. A locally-authored snapshot imports no upstream message/author.
#
# Nothing is pushed until sync-guard.ps1 — run from the trusted dev checkout, not
# from the incoming candidate — classifies every tree delta and passes. Any new
# path, protected-blob change, signing/workflow/schema/layer change or ANY
# unclassified delta blocks the run: it pushes nothing and pings Telegram so the
# reconciliation is finished on the PC. There is deliberately no branch input and
# no bypass input.
#
# The first steady-state run is EXPECTED to block (Nagram's tip adds BRANDING.md,
# an unreviewed new path). That block is the mechanism working, not a failure.

on:
  workflow_dispatch: {}

# The job token stays read-only. All writing is done by SYNC_TOKEN, which is the
# only credential allowed to push .github/workflows and to trigger staging.yml.
permissions:
  contents: read

concurrency:
  group: sync-refs
  cancel-in-progress: false

jobs:
  sync:
    name: Snapshot-merge Nagram onto dev
    runs-on: ubuntu-latest

    steps:
      - name: Require SYNC_TOKEN (no GITHUB_TOKEN fallback)
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is unset. This sync must not fall back to GITHUB_TOKEN:"
            echo "::error::the default token cannot push .github/workflows/ and its push would"
            echo "::error::skip the staging trigger, producing a sync that silently bypasses the"
            echo "::error::build signal. Set SYNC_TOKEN (a fine-grained PAT with Contents: write + Workflows: write)."
            exit 1
          fi

      - name: Checkout dev (the trusted PRE)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure local git identity
        run: |
          git config user.name  "dazegram-sync"
          git config user.email "sync@dazegram.local"

      - name: Verify SYNC_TOKEN can push dev (safe controlled probe)
        id: tokentest
        run: |
          set -e
          PRE=$(git rev-parse HEAD)
          # A no-op dry-run push to dev exercises auth + push permission without
          # writing anything. The full workflow-file push permission is only
          # provable by the real atomic push below, which fails explicitly (not
          # silently) if the token lacks Workflows: write.
          if ! git push --dry-run origin "$PRE:refs/heads/dev"; then
            echo "::error::SYNC_TOKEN cannot push dev. It needs Contents: write + Workflows: write."
            exit 1
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Load pins from the trusted PRE
        id: pins
        run: |
          set -e
          P=.github/sync/pins.env
          # Fail hard on a missing/empty key: assigning the command substitution to
          # a plain variable propagates the `return 1` exit status, so `set -e`
          # aborts here rather than letting the job proceed on an empty ref/pin.
          need() {
            local v
            v=$(grep -E "^$1=" "$P" | head -n1 | cut -d= -f2-)
            [ -n "$v" ] || { echo "::error::pins.env missing/empty key: $1" >&2; return 1; }
            printf '%s' "$v"
          }
          ANCHOR_SRC=$(need ANCHOR_SRC)
          NAGRAM_REPO=$(need NAGRAM_REPO)
          NAGRAM_BRANCH=$(need NAGRAM_BRANCH)
          KEYSTORE_PATH=$(need KEYSTORE_PATH)
          CERT_SHA=$(need KEYSTORE_CERT_SHA256)
          SUBJECT_CN=$(need KEYSTORE_SUBJECT_CN)
          {
            echo "anchor_src=$ANCHOR_SRC"
            echo "nagram_repo=$NAGRAM_REPO"
            echo "nagram_branch=$NAGRAM_BRANCH"
            echo "keystore_path=$KEYSTORE_PATH"
            echo "cert_sha=$CERT_SHA"
            echo "subject_cn=$SUBJECT_CN"
          } >> "$GITHUB_OUTPUT"

      - name: nbase must exist (deletion protection; no auto-bootstrap)
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin nbase >/dev/null 2>&1; then
            echo "::error::origin/nbase is absent. This is the steady-state path and it"
            echo "::error::refuses to bootstrap automatically — a missing nbase is a protected"
            echo "::error::deletion incident, not a routine sync. Restore nbase on the PC."
            exit 1
          fi
          git fetch origin nbase

      - name: Fetch Nagram source (hardcoded repo + branch)
        run: |
          set -e
          git remote add nagram "${{ steps.pins.outputs.nagram_repo }}" \
            || git remote set-url nagram "${{ steps.pins.outputs.nagram_repo }}"
          git fetch --no-tags nagram "${{ steps.pins.outputs.nagram_branch }}"

      - name: Resolve and record source + refs
        id: refs
        run: |
          set -e
          PRE=$(git rev-parse origin/dev)
          OLD_NBASE=$(git rev-parse origin/nbase)
          NEW_SRC=$(git rev-parse nagram/${{ steps.pins.outputs.nagram_branch }})
          SRC_TREE=$(git rev-parse "${NEW_SRC}^{tree}")
          echo "PRE=$PRE"
          echo "OLD_NBASE=$OLD_NBASE"
          echo "NEW_SRC=$NEW_SRC  SRC_TREE=$SRC_TREE"
          {
            echo "pre=$PRE"
            echo "old_nbase=$OLD_NBASE"
            echo "new_src=$NEW_SRC"
            echo "src_tree=$SRC_TREE"
          } >> "$GITHUB_OUTPUT"

      - name: No-op fast path (skip a redundant snapshot when nothing to import)
        id: fastpath
        shell: pwsh
        run: |
          # dev is checked out, so this is the PRE copy of the guard, reading the
          # trusted PRE pins. It compares the resolved source tree against the live
          # origin/nbase tree BEFORE any snapshot is built. Exit codes: 0 = proceed
          # (a delta may exist), 3 = already up to date (skip snapshot + push), 1 =
          # blocked (equal tree but a stale pin — a human must repin). See
          # sync-guard.ps1 Test-SyncFastPath for why an equal tree with a stale pin
          # blocks rather than falling through.
          ./.github/sync/sync-guard.ps1 -FastPathOnly `
            -PreRef   '${{ steps.refs.outputs.pre }}' `
            -OldNbase '${{ steps.refs.outputs.old_nbase }}' `
            -NewSrc   '${{ steps.refs.outputs.new_src }}'
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            "uptodate=1" >> $env:GITHUB_OUTPUT
            Write-Host 'Nothing to import: the snapshot, merge, guard, signer, push and verify steps are skipped and this run ends successfully.'
            exit 0
          }
          if ($code -eq 0) {
            "uptodate=0" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # 1 = stale-pin block, 2 = a real error resolving refs/pins. Either way the
          # run fails and the failure notifier fires; nothing was pushed.
          Write-Host "::error::fast-path gate failed (exit $code). Pushing nothing."
          exit 1

      - name: Build synthetic snapshot (local author, no upstream import)
        id: snapshot
        if: steps.fastpath.outputs.uptodate != '1'
        env:
          GIT_AUTHOR_NAME: dazegram-sync
          GIT_AUTHOR_EMAIL: sync@dazegram.local
          GIT_COMMITTER_NAME: dazegram-sync
          GIT_COMMITTER_EMAIL: sync@dazegram.local
        run: |
          set -e
          SHORT=$(git rev-parse --short "${{ steps.refs.outputs.new_src }}")
          NEW_SNAP=$(git commit-tree "${{ steps.refs.outputs.src_tree }}" \
            -p "${{ steps.refs.outputs.old_nbase }}" \
            -m "snapshot Nagram ${SHORT} as nbase anchor #infra")
          echo "new_snap=$NEW_SNAP" >> "$GITHUB_OUTPUT"
          echo "snapshot=$NEW_SNAP"

      - name: Build merge candidate (conflict-guarded, never auto-resolved)
        id: merge
        if: steps.fastpath.outputs.uptodate != '1'
        run: |
          set -e
          git switch -c _sync_candidate "${{ steps.refs.outputs.pre }}"
          if ! git merge --no-edit --no-ff "${{ steps.snapshot.outputs.new_snap }}"; then
            git merge --abort || true
            git switch dev
            echo "::error::3-way merge of the snapshot into dev conflicts. Never auto-resolved."
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          NEW_DEV=$(git rev-parse HEAD)
          git switch dev
          echo "new_dev=$NEW_DEV" >> "$GITHUB_OUTPUT"
          echo "candidate=$NEW_DEV"

      - name: Run the guard (from the trusted PRE checkout)
        id: guard
        if: steps.fastpath.outputs.uptodate != '1'
        shell: pwsh
        run: |
          # dev is checked out here, so .github/sync/sync-guard.ps1 is the PRE copy.
          ./.github/sync/sync-guard.ps1 `
            -PreRef      '${{ steps.refs.outputs.pre }}' `
            -OldNbase    '${{ steps.refs.outputs.old_nbase }}' `
            -NewSnapshot '${{ steps.snapshot.outputs.new_snap }}' `
            -NewSrc      '${{ steps.refs.outputs.new_src }}' `
            -NewDev      '${{ steps.merge.outputs.new_dev }}'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::guard blocked the candidate (exit $LASTEXITCODE). Pushing nothing."
            exit $LASTEXITCODE
          }

      - name: Prove signer certificate identity (guard 13, in-memory password)
        if: steps.fastpath.outputs.uptodate != '1'
        shell: pwsh
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCAL_PROPERTIES) { Write-Host '::error::LOCAL_PROPERTIES unset'; exit 1 }
          # Decode the properties in memory; never write them to disk or the log.
          $props = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LOCAL_PROPERTIES))
          $kv = @{}
          foreach ($l in ($props -split "`n")) { if ($l -match '^\s*([^#=]+?)\s*=\s*(.*?)\s*$') { $kv[$Matches[1]] = $Matches[2] } }
          $alias = $kv['ALIAS_NAME']
          # Guard failures, not tooling errors: an empty alias or store password means
          # we cannot prove the signing identity, so we refuse to push rather than
          # letting keytool fail ambiguously later.
          if (-not $alias) { Write-Host '::error::guard: ALIAS_NAME is empty — cannot select the signing key to prove its identity. Refusing to push.'; exit 1 }
          if (-not $kv['KEYSTORE_PASS']) { Write-Host '::error::guard: KEYSTORE_PASS is empty — cannot open the keystore to prove the signer. Refusing to push.'; exit 1 }
          # Keystore and DER live under RUNNER_TEMP and are removed in finally, so
          # nothing signing-related is left in the workspace on any exit path.
          $ks  = Join-Path $env:RUNNER_TEMP 'candidate.keystore'
          $der = Join-Path $env:RUNNER_TEMP 'cert.der'
          try {
            # Extract the pinned keystore blob as raw bytes. A pwsh `>` redirect
            # re-encodes as text and would corrupt the binary, so shell out to bash
            # for a byte-accurate redirect, and check git's exit code explicitly
            # (pwsh does not throw on a native-command failure).
            $spec = "${{ steps.merge.outputs.new_dev }}:${{ steps.pins.outputs.keystore_path }}"
            bash -c "git cat-file blob '$spec' > '$ks'"
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::git cat-file of the keystore failed'; exit 1 }
            # Pass the store password via a child-process env var — never on the
            # command line, never via GITHUB_ENV, no set -x. keytool reads it from env.
            $env:KS_STOREPASS = $kv['KEYSTORE_PASS']
            # Force keytool to English so the "Entry type:" / "Owner:" labels are
            # deterministic — a localised runner would otherwise never match them,
            # a parse that can never match is a check that can never fail. Set via
            # JAVA_TOOL_OPTIONS (the -J flag mangles under pwsh arg parsing).
            $env:JAVA_TOOL_OPTIONS = '-Duser.language=en -Duser.country=US'
            # The alias must resolve to a signing-capable key, not merely a
            # certificate. A trustedCertEntry holds the pinned cert with NO private
            # key: exportcert + SHA-256 + CN would all pass, yet it cannot sign.
            # Require the entry type to be PrivateKeyEntry. Match the "Entry type:"
            # line strictly (a substring search of the whole blob could match a
            # future format change vacuously), and NEVER print the -list output —
            # it carries "Alias name: <alias>", which must not be disclosed.
            $listOut = (& keytool -list -v -keystore $ks -alias $alias -storepass:env KS_STOREPASS 2>&1 | Out-String -Width 8192)
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::keytool -list of the signing alias failed'; exit 1 }
            $entryType = ''
            foreach ($ln in ($listOut -split "`n")) { if ($ln -match '^\s*Entry type:\s*(\S+)') { $entryType = $Matches[1]; break } }
            if ($entryType -ne 'PrivateKeyEntry') {
              Write-Host "::error::signer alias entry type is '$entryType', not PrivateKeyEntry — a certificate-only entry passes exportcert but has no private key and cannot sign. Push nothing."
              exit 1
            }
            & keytool -exportcert -keystore $ks -alias $alias -storepass:env KS_STOREPASS -file $der
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::keytool exportcert failed'; exit 1 }
            $hash = (Get-FileHash -Algorithm SHA256 $der).Hash.ToLowerInvariant()
            $pin = '${{ steps.pins.outputs.cert_sha }}'
            if ($hash -ne $pin) {
              Write-Host "::error::signer cert SHA-256 $hash != pinned $pin — wrong signing key. Push nothing."
              exit 1
            }
            # Identity, not just bytes: the exported cert must carry the pinned
            # subject CN. -printcert prints "Owner: CN=..., ..." — public metadata,
            # no secret.
            $owner = (& keytool -printcert -file $der | Select-String -Pattern '^Owner:') -join ' '
            $cn = '${{ steps.pins.outputs.subject_cn }}'
            if ($owner -notmatch [regex]::Escape("CN=$cn")) {
              Write-Host "::error::signer subject '$owner' does not carry CN=$cn — wrong signer. Push nothing."
              exit 1
            }
            Write-Host "signer identity confirmed (PrivateKeyEntry + SHA-256 + CN=$cn)."
          } finally {
            $env:KS_STOREPASS = $null
            $env:JAVA_TOOL_OPTIONS = $null
            Remove-Item -LiteralPath $ks, $der -ErrorAction SilentlyContinue
          }

      - name: Atomic append-only push of dev + nbase
        id: push
        if: steps.fastpath.outputs.uptodate != '1'
        run: |
          set -e
          PRE=${{ steps.refs.outputs.pre }}
          OLD_NBASE=${{ steps.refs.outputs.old_nbase }}
          NEW_DEV=${{ steps.merge.outputs.new_dev }}
          NEW_SNAP=${{ steps.snapshot.outputs.new_snap }}

          # Re-read both remote refs and re-assert the leases + append-only shape
          # immediately before pushing (guard 15).
          git fetch origin dev nbase
          [ "$(git rev-parse origin/dev)"   = "$PRE" ]       || { echo "::error::dev moved under us"; exit 1; }
          [ "$(git rev-parse origin/nbase)" = "$OLD_NBASE" ] || { echo "::error::nbase moved under us"; exit 1; }
          git merge-base --is-ancestor "$PRE" "$NEW_DEV"        || { echo "::error::new dev is not a descendant of PRE (not append-only)"; exit 1; }
          git merge-base --is-ancestor "$OLD_NBASE" "$NEW_SNAP" || { echo "::error::new nbase is not a descendant of old nbase"; exit 1; }

          # Both refs move together or neither does. There is no sequential
          # fallback: a partial update would leave the tree without its anchor.
          git push --atomic \
            --force-with-lease=refs/heads/dev:"$PRE" \
            --force-with-lease=refs/heads/nbase:"$OLD_NBASE" \
            origin "$NEW_DEV:refs/heads/dev" "$NEW_SNAP:refs/heads/nbase"

          # Record that the push actually completed. A failure in a LATER step must
          # not tell the operator "nothing pushed" — the refs have already moved.
          echo "pushed=1" >> "$GITHUB_OUTPUT"
          echo "pushed atomically: dev -> $NEW_DEV, nbase -> $NEW_SNAP"

      - name: Verify remote refs landed (the push to dev triggers staging)
        if: steps.fastpath.outputs.uptodate != '1'
        run: |
          set -e
          git fetch origin dev nbase
          [ "$(git rev-parse origin/dev)"   = "${{ steps.merge.outputs.new_dev }}" ]     || { echo "::error::dev did not land"; exit 1; }
          [ "$(git rev-parse origin/nbase)" = "${{ steps.snapshot.outputs.new_snap }}" ] || { echo "::error::nbase did not land"; exit 1; }
          echo "dev and nbase updated atomically. The push to dev triggers staging.yml (dual APK + Telegram upload); this step confirms the refs, not the downstream run."

      - name: Notify on any failure
        if: failure()
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          HELPER_BOT_TARGET: ${{ secrets.HELPER_BOT_TARGET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRE: ${{ steps.refs.outputs.pre }}
          ANCHOR: ${{ steps.pins.outputs.anchor_src }}
          NEW_SRC: ${{ steps.refs.outputs.new_src }}
          NEW_DEV: ${{ steps.merge.outputs.new_dev }}
          NEW_SNAP: ${{ steps.snapshot.outputs.new_snap }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          if [ -z "$HELPER_BOT_TOKEN" ] || [ -z "$HELPER_BOT_TARGET" ]; then
            echo "Telegram secrets unset; skipping notification."; exit 0
          fi
          if [ "$PUSHED" = "1" ]; then
            # The atomic push already succeeded; this failure is post-push (e.g. the
            # verify step). Never say "nothing pushed" — the refs have moved.
            TEXT="⚠️ Dazegram sync: the atomic push SUCCEEDED but a post-push step failed. The refs have ALREADY advanced — do NOT re-run as if nothing happened.
          dev  is now: ${NEW_DEV:-unknown}
          nbase is now: ${NEW_SNAP:-unknown}
          Verify with: git fetch origin dev nbase && git rev-parse origin/dev origin/nbase
          run: ${RUN_URL}"
          else
            REASON="guard/topology/token/atomic-push"
            [ -n "$CONFLICT" ] && REASON="merge conflict"
            TEXT="⚠️ Dazegram sync blocked (${REASON}). Nothing pushed.
          PRE: ${PRE:-unknown}
          anchor: ${ANCHOR:-unknown}
          source: ${NEW_SRC:-unresolved}
          run: ${RUN_URL}
          Finish the reconciliation on the PC."
          fi
          curl -s "https://api.telegram.org/bot${HELPER_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${HELPER_BOT_TARGET}" \
            --data-urlencode "text=${TEXT}" >/dev/null
