name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to rebase onto'
        required: false
        default: 'dev'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Rebase dev onto upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/risin42/NagramX.git

      - name: Fetch upstream
        run: git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Rebase dev onto upstream/${{ github.event.inputs.upstream_branch }}
        run: |
          git rebase upstream/${{ github.event.inputs.upstream_branch }}

      - name: Push updated dev
        run: git push origin dev --force-with-lease

      - name: Trigger staging build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run staging.yml --ref dev --repo ${{ github.repository }}
