name: Staging build

# The publish-on-request build + Telegram-upload pipeline. Runs and uploads on:
#   - every push to dev (the post-land dual-package delivery — unconditional);
#   - a pull request that gets the build-apk label (an on-demand preview);
#   - a manual workflow_dispatch.
# It builds the release-signed dual-package APK (native included) and uploads it
# to Telegram — there is no skip switch. Intermediate PR pushes no longer build
# here; the fast Java/Kotlin gate is ci.yml, and an APK is produced only when
# explicitly requested, so Telegram only sees builds worth installing. The
# build-apk label is auto-removed at the start of each run so re-applying it acts
# as a repeatable button. Doc-only, .github-only and git-hook-only pushes to dev
# are skipped (a hook is a local script, never packaged). A newer run supersedes
# an older in-flight one on the same branch or PR (see the concurrency group).

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/staging.yml'
      - 'docs/**'
      - '.githooks/**'
  pull_request:
    # No paths-ignore here on purpose: a build the user explicitly requested via
    # the label is relevant by definition, even on a doc-only PR. Path filtering
    # would apply to the labeled trigger too and silently drop that request.
    types: [labeled]
  workflow_dispatch:

# Drop an older run on the same branch/PR rather than building it out: a few
# rounds of review each shipped their own pair of APKs, which is what trips the
# bot's flood limit. The group is workflow-level on purpose — a job-level group
# only queues a superseded run behind the one already going, so every push still
# built and uploaded eventually. Cancelling at the run level takes the whole
# matrix and the upload job with it, which is what "keep the latest only" means.
concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  models: read

jobs:
  # Remove the build-apk label at the start of a labeled run so re-applying it
  # re-triggers a build — the label behaves as a repeatable button. Kept as its
  # own single job (not folded into the matrix, where it would run once per
  # package and the second DELETE would 404 and fail the leg). Job-level write
  # scope keeps the token narrow; the DELETE tolerates a 404 (already removed, or
  # a re-run). The build job orders after this via needs but does not depend on
  # its success.
  unlabel:
    name: Remove build-apk label
    runs-on: ubuntu-latest
    # Same-repo only: a fork PR gets a read-only token, so the label DELETE below
    # would 403. dazewell's flow is all same-repo branches, so this never fires on
    # a legitimate request — it just keeps a stray fork PR from a doomed run.
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build-apk' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/build-apk")
          echo "DELETE label -> HTTP $CODE"
          # 200 removed, 404 already gone — both fine. Anything else is a real error.
          if [ "$CODE" != "200" ] && [ "$CODE" != "404" ]; then
            exit 1
          fi
  build:
    name: Gradle Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs:
      - unlabel
    # Build on a push to dev, a manual dispatch, or a build-apk labelling. The
    # unlabel job is skipped on the first two, so gate on !cancelled() plus the
    # event rather than on its result — a skipped need would otherwise skip this
    # job. !cancelled() (not always()) is deliberate: always() would keep the
    # build going after the concurrency group cancels a superseded run, which is
    # the flood the group exists to stop. A skipped or failed unlabel is not a
    # cancellation, so !cancelled() still runs here in both those cases.
    if: >-
      !cancelled() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.label.name == 'build-apk' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: nekox.messenger
            artifact: Unofficial
          - package: org.telegram.messenger.beta
            artifact: Official
    outputs:
      build_timestamp: ${{ steps.staging_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleStaging -PAPP_PACKAGE=${{ matrix.package }}

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.APK }}
  upload:
    name: Upload staging
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Prepare commit summary
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          # Resolve event context: pull_request events don't populate head_commit,
          # and github.sha/ref_name point at the synthetic merge, so derive the
          # real branch/sha/message from the PR payload instead.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$PR_HEAD_REF"
            HEAD_SHA="$PR_HEAD_SHA"
            HEAD_MSG="$PR_TITLE"
          else
            BRANCH="$PUSH_BRANCH"
            HEAD_SHA="$PUSH_SHA"
            HEAD_MSG=$(git log -1 --pretty=%B HEAD)
          fi
          echo "event=$EVENT_NAME branch=$BRANCH head=$HEAD_SHA"

          # Emit the ai_summary output (multiline-safe) and return.
          write_summary() {
            {
              echo "ai_summary<<SUMEOF"
              printf '%s\n' "$1"
              echo "SUMEOF"
            } >> "$GITHUB_OUTPUT"
          }

          LAST_SHA=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/staging.yml/runs?status=completed&conclusion=success&branch=$BRANCH&per_page=1" | jq -r '.workflow_runs[0].head_sha // empty')
          echo "last successful build: ${LAST_SHA:-<none>}"

          COMMIT_TEXT=""
          TOTAL_COMMITS=0
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" != "$HEAD_SHA" ]; then
            COMPARE=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/compare/$LAST_SHA...$HEAD_SHA")
            TOTAL_COMMITS=$(echo "$COMPARE" | jq -r '.total_commits // 0')
            COMMIT_TEXT=$(echo "$COMPARE" | jq -r '[.commits[].commit.message] | join("\n\n")')
          fi
          [ -n "$COMMIT_TEXT" ] || COMMIT_TEXT="$HEAD_MSG"
          echo "commits since last build: $TOTAL_COMMITS"

          if [ -z "$COMMIT_TEXT" ]; then
            echo "no commit text available; skipping AI summary."
            write_summary ""
            exit 0
          fi

          MODEL_ID="${{ vars.AI_MODEL }}"
          [ -n "$MODEL_ID" ] || MODEL_ID="openai/gpt-4.1"
          echo "model: $MODEL_ID"

          PROMPT=$(cat << 'EOP'
          Please summarize the Git commit messages between the last CI build and the current build using Telegram HTML formatting (not Markdown):
          - Output strictly valid HTML supported by Telegram (e.g., <b>, <i>, <u>, <s>, <code>, <pre>, <a href="...">, <blockquote>).
          - Do NOT use Markdown, code fences, or backticks. No triple backticks.
          - Telegram does NOT support <br>; use a real line break (an actual newline character) for every new line. Never emit <br>.
          - Group by type with HTML headers: <b>✨ Features</b>, <b>🐛 Fixes</b>, <b>♻️ Refactors</b>, <b>⚠️ Breaking Changes</b>, <b>🧹 Others</b>.
          - Put exactly one blank line (one empty line) between each header section.
          - Under each header, put each item on its own line separated by a newline and start each item with • (bullet), keep each item one line, max 20 total items across all sections.
          - Escape any &, <, > characters from commit messages as &amp;, &lt;, &gt;.
          - Aggressively ignore trivial commits (merge commits, formatting, chore/version bumps, bump-deps, docs-only). Only surface user-facing changes, bug fixes, refactors affecting behavior, or notable internal changes.
          Here are the commit messages:
          EOP
          )
          # printf so the prompt and commit list are joined by a real newline
          # (a double-quoted "\n" stays a literal backslash-n and confuses the model).
          CONTENT=$(printf '%s\n%s' "$PROMPT" "$COMMIT_TEXT")
          PAYLOAD=$(jq -n --arg content "$CONTENT" --arg model "$MODEL_ID" '{messages:[{role:"user",content:$content}],model:$model}')

          BODY=$(mktemp)
          HTTP_CODE=$(curl -s -o "$BODY" -w "%{http_code}" "https://models.github.ai/inference/chat/completions" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer $GITHUB_TOKEN" \
             -d "$PAYLOAD")
          echo "::group::GitHub Models response (HTTP $HTTP_CODE)"
          cat "$BODY"; echo
          echo "::endgroup::"

          SUMMARY=$(jq -r '.choices[0].message.content // empty' < "$BODY")
          if [ -z "$SUMMARY" ]; then
            echo "::warning::AI summary empty (HTTP $HTTP_CODE): $(jq -r '.error.message // "no content in response"' < "$BODY")"
          fi

          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" != "$HEAD_SHA" ]; then
            DIFF_URL="https://github.com/$REPO/compare/$LAST_SHA...$HEAD_SHA"
          else
            DIFF_URL="https://github.com/$REPO/commit/$HEAD_SHA"
          fi

          # Literal \n sequences are converted to real newlines by upload.py.
          COMBINED=""
          [ -n "$SUMMARY" ] && COMBINED="Changes since last build:\n\n$SUMMARY\n\n"
          COMBINED="$COMBINED<a href=\"$DIFF_URL\"><b>Full changes</b></a>"
          write_summary "$COMBINED"
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
          AI_SUMMARY: ${{ steps.prepare.outputs.ai_summary }}
        run: |
          set -e
          # A pull_request run is checked out at the merge ref, so fetch the real
          # PR head to read its commit message; a push is already at that commit.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_HEAD_SHA"
            export BRANCH="$PR_HEAD_REF"
            BUILD_TYPE="test"
            git fetch --depth=1 origin "$SHA"
          else
            SHA="$PUSH_SHA"
            export BRANCH="$PUSH_BRANCH"
            BUILD_TYPE="staging"
          fi
          export COMMIT_ID="$SHA"
          export COMMIT_URL="$SERVER_URL/$REPO/commit/$SHA"
          export COMMIT_MESSAGE=$(git log -1 --pretty=%B "$SHA")
          # Send both package variants as one Telegram album.
          python -m pip install -r Tools/scripts/requirements.txt
          export ARTIFACTS_PATH="artifacts"
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} "$BUILD_TYPE"
