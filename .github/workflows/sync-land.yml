name: Sync land

# Land a finished upstream reconciliation. Manually dispatched by dazewell once the
# reconciliation has been merged into dev (that is step 1, and it stays a human PR).
# This workflow automates steps 2 and 3 of the hand dance described in
# .claude/skills/nagramx-branch-flow/SKILL.md:
#
#   step 2  fast-forward origin/nbase onto the reconciliation snapshot (non-force),
#   step 3  open a PR that advances the anchor pins in .github/sync/pins.env.
#
# The operator's job shrinks to: merge the reconciliation PR, press Run workflow, then
# review and merge the one auto-drafted pins PR. It also shrinks a real side effect:
# between step 2 landing and step 3 landing, every other open branch shows a red
# sync-guard-check, because dev's pins still name the old anchor while origin/nbase has
# moved past it. That window drops from "whenever someone writes the pins PR" to minutes.
#
# Why the three steps still cannot collapse into a single PR: sync-guard-check hard-fails
# while origin/nbase is not equal to the OLD_NBASE pinned in a candidate's own pins.env
# (sync-guard-check.yml fetches live origin/nbase and asserts equality). origin/nbase
# cannot move until the reconciliation is on dev, and the pins PR cannot be green until
# origin/nbase has moved, so no single-PR ordering is ever green. This workflow keeps
# that forced ordering; it only removes the hand git.
#
# Nothing here trusts an operator-supplied SHA blindly. sync-guard.ps1 -LandCheckOnly
# re-derives, live from upstream, the commit whose tree the snapshot copies, and blocks
# unless the snapshot is a faithful, locally-authored, anchor-descended copy of a real
# upstream commit that fast-forwards the live nbase. The guard self-tests before it is
# trusted. This workflow never pushes dev and never force-pushes anything.
#
# CRITICAL: the pins PR is created with SYNC_TOKEN, never GITHUB_TOKEN. A PR opened by
# the built-in GITHUB_TOKEN does not trigger pull_request workflows, so sync-guard-check
# would be MISSING on it — and an absent required check is indistinguishable from a
# passing one. The pins PR's entire safety argument is that sync-guard-check still gates
# it, so the run polls and asserts that check actually reported on the PR head before it
# declares the PR ready, and fails closed if it never does.
#
# SYNC_TOKEN scope required: Contents: write (move nbase; the snapshot tree carries
# .github/workflows/, so Workflows: write is also required) and Pull requests: write
# (open the pins PR). Same identity as sync-upstream.
#
# Idempotent by design — safe to re-run after a partial failure:
#   - if origin/nbase already equals the snapshot, the fast-forward is skipped, not an
#     error;
#   - if the pins branch already exists it is reused, never a second one, and never
#     rewritten (no force-push);
#   - if an open pins PR already exists it is reported and the run still verifies its
#     guard-check, then exits 0;
#   - the fast-forward is non-force with an explicit refspec, re-leased immediately
#     before the push; dev is never pushed under any code path.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Reconciliation snapshot commit SHA. Leave blank to read refs/sync/snapshot-* (published there by a blocked sync run). Give the SHA explicitly when the reconciliation was done fully by hand."
        required: false
        type: string

permissions:
  contents: read
  actions: read

# One shared lane with sync-upstream: both workflows move nbase. A phone-tapped sync
# must not mint a snapshot on the old nbase while this run is fast-forwarding it.
concurrency:
  group: sync-refs
  cancel-in-progress: false

jobs:
  land:
    name: Fast-forward nbase and open the pins PR
    runs-on: ubuntu-latest
    steps:
      - name: Require SYNC_TOKEN (no GITHUB_TOKEN fallback)
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is unset. The pins PR must be created by SYNC_TOKEN, not GITHUB_TOKEN:"
            echo "::error::a PR opened by the built-in token does not trigger pull_request workflows, so it"
            echo "::error::would arrive with sync-guard-check MISSING — the guard's own documented defeat."
            echo "::error::Set SYNC_TOKEN (Contents: write + Workflows: write + Pull requests: write)."
            exit 1
          fi

      - name: Checkout dev (the trusted PRE)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Load pins from the trusted PRE
        id: pins
        run: |
          set -e
          P=.github/sync/pins.env
          need() {
            v=$(grep -E "^$1=" "$P" | head -n1 | cut -d= -f2-)
            if [ -z "$v" ]; then echo "::error::pins.env missing/empty key: $1" >&2; exit 1; fi
            printf '%s' "$v"
          }
          {
            echo "nagram_repo=$(need NAGRAM_REPO)"
            echo "nagram_branch=$(need NAGRAM_BRANCH)"
            echo "old_nbase_pin=$(need OLD_NBASE)"
            echo "sync_identity_name=$(need SYNC_IDENTITY_NAME)"
            echo "sync_identity_email=$(need SYNC_IDENTITY_EMAIL)"
          } >> "$GITHUB_OUTPUT"

      - name: Configure local git identity from pins
        run: |
          set -e
          # pins.env is the single source of truth for the sync identity; the guard's
          # land check asserts the snapshot carries it, so the pins-PR commit must use
          # the same values rather than a second hardcoded copy that could drift.
          git config user.name  "${{ steps.pins.outputs.sync_identity_name }}"
          git config user.email "${{ steps.pins.outputs.sync_identity_email }}"

      - name: nbase must exist (deletion protection)
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin nbase >/dev/null 2>&1; then
            echo "::error::origin/nbase is absent. This is a protected deletion incident, not a routine land."
            echo "::error::Restore nbase on the PC before running sync-land."
            exit 1
          fi
          git fetch origin nbase

      - name: Fetch upstream (nagram) for live tree/ancestry resolution
        run: |
          set -e
          git remote add nagram "${{ steps.pins.outputs.nagram_repo }}" 2>/dev/null \
            || git remote set-url nagram "${{ steps.pins.outputs.nagram_repo }}"
          # Full history so the land check can scan for the upstream commit whose tree the
          # snapshot copies, and confirm anchor ancestry.
          git fetch --no-tags nagram "${{ steps.pins.outputs.nagram_branch }}"

      - name: Resolve the reconciliation snapshot
        id: snap
        env:
          SNAP_INPUT: ${{ github.event.inputs.snapshot }}
        run: |
          set -e
          # Published snapshot refs live in a non-branch namespace that fires no Actions
          # runs. Pull them as a convenience default; degrade gracefully if absent.
          git fetch --no-tags origin '+refs/sync/snapshot-*:refs/sync/snapshot-*' 2>/dev/null || true
          if [ -n "$SNAP_INPUT" ]; then
            if ! git cat-file -e "${SNAP_INPUT}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$SNAP_INPUT" 2>/dev/null || true
            fi
            if ! git cat-file -e "${SNAP_INPUT}^{commit}" 2>/dev/null; then
              echo "::error::snapshot '$SNAP_INPUT' is not a resolvable commit on origin."; exit 1
            fi
            SNAP=$(git rev-parse "${SNAP_INPUT}^{commit}")
            echo "resolved snapshot from explicit input: $SNAP"
          else
            REFS=$(git for-each-ref --format='%(objectname) %(refname)' 'refs/sync/' | grep '/snapshot-' || true)
            N=$(printf '%s\n' "$REFS" | grep -c . || true)
            if [ "$N" -eq 0 ]; then
              echo "::error::no snapshot input given and no refs/sync/snapshot-* found."
              echo "::error::Re-run with the snapshot SHA in the 'snapshot' input."; exit 1
            fi
            if [ "$N" -gt 1 ]; then
              echo "::error::multiple refs/sync/snapshot-* refs exist; ambiguous. Re-run with the exact SHA:"
              printf '  %s\n' "$REFS"; exit 1
            fi
            SNAP=$(printf '%s' "$REFS" | cut -d' ' -f1)
            echo "resolved snapshot from refs/sync/snapshot-*: $SNAP"
          fi
          OLD_NBASE=$(git rev-parse origin/nbase)
          { echo "snapshot=$SNAP"; echo "old_nbase=$OLD_NBASE"; } >> "$GITHUB_OUTPUT"

      - name: Land check (block unless the snapshot is safe to fast-forward onto)
        id: landcheck
        shell: pwsh
        run: |
          $ev = Join-Path $env:RUNNER_TEMP 'land-evidence.txt'
          ./.github/sync/sync-guard.ps1 -LandCheckOnly `
            -OldNbase    '${{ steps.snap.outputs.old_nbase }}' `
            -NewSnapshot '${{ steps.snap.outputs.snapshot }}' `
            -EvidenceOut $ev
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::land check refused the snapshot (exit $code). origin/nbase NOT moved. Finish the reconciliation on the PC."
            exit 1
          }
          "evidence=$ev" >> $env:GITHUB_OUTPUT

      - name: Fast-forward origin/nbase (idempotent, non-force, re-leased)
        id: ff
        run: |
          set -e
          SNAP='${{ steps.snap.outputs.snapshot }}'
          VERIFIED_OLD='${{ steps.snap.outputs.old_nbase }}'
          git fetch origin nbase
          LIVE=$(git rev-parse origin/nbase)
          if [ "$LIVE" = "$SNAP" ]; then
            echo "origin/nbase is already at the snapshot; skipping fast-forward (idempotent re-run)."
            echo "nbase_at_snap=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Append-only: the snapshot must be a descendant of the live nbase, so this is a
          # true fast-forward and never rewinds or diverges nbase.
          if ! git merge-base --is-ancestor "$LIVE" "$SNAP"; then
            echo "::error::snapshot $SNAP is not a descendant of live origin/nbase $LIVE; refusing a non-fast-forward move."; exit 1
          fi
          # Re-lease: the live nbase must still be exactly what the land check verified
          # against. If a sync minted a new snapshot in our window, abort and re-run.
          if [ "$LIVE" != "$VERIFIED_OLD" ]; then
            echo "::error::origin/nbase moved under us ($LIVE != verified $VERIFIED_OLD). Aborting; re-run sync-land."; exit 1
          fi
          # Non-force, explicit refspec. A plain push is fast-forward-only, so the server
          # rejects any non-ff move rather than overwriting — no --force, no leading '+',
          # and refs/heads/dev is never a target here.
          git push origin "$SNAP:refs/heads/nbase"
          echo "origin/nbase fast-forwarded: $LIVE -> $SNAP"
          echo "nbase_at_snap=1" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the pins PR (created by SYNC_TOKEN so it is gated)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          R: ${{ github.repository }}
          EV: ${{ steps.landcheck.outputs.evidence }}
        run: |
          set -e
          SNAP='${{ steps.snap.outputs.snapshot }}'
          OLD_NBASE='${{ steps.snap.outputs.old_nbase }}'
          SNAP_SHORT=$(git rev-parse --short "$SNAP")
          BR="sync-land-pins-$SNAP_SHORT"

          getev() { grep -E "^$1=" "$EV" | head -n1 | cut -d= -f2-; }
          ANCHOR_NEW=$(getev anchor_src_new)
          SNAP_TREE=$(getev snapshot_tree)
          SRC_TREE=$(getev anchor_src_new_tree)
          PIN_ANCHOR=$(getev pinned_anchor_src)
          TREES_MATCH=$(getev trees_match)
          if [ -z "$ANCHOR_NEW" ]; then echo "::error::evidence missing anchor_src_new; land check did not resolve an upstream source."; exit 1; fi
          ANCHOR_NEW_SHORT=$(git rev-parse --short "$ANCHOR_NEW")

          git fetch origin dev

          # Idempotent: is an open pins PR already present for this branch?
          PRN=$(gh pr list --repo "$R" --head "$BR" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PRN" ]; then
            echo "pins PR already open: #$PRN — reusing, not creating a second."
          else
            if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "pins branch $BR already exists on origin; reusing it without rewriting."
            else
              git switch -c "$BR" origin/dev
              # Advance only the three anchor pins; leave every other line untouched.
              sed -i "s|^ANCHOR_SRC=.*|ANCHOR_SRC=$ANCHOR_NEW|"        .github/sync/pins.env
              sed -i "s|^OLD_NBASE=.*|OLD_NBASE=$SNAP|"                .github/sync/pins.env
              sed -i "s|^OLD_NBASE_TREE=.*|OLD_NBASE_TREE=$SNAP_TREE|" .github/sync/pins.env
              if git diff --quiet -- .github/sync/pins.env; then
                echo "::error::pins.env unchanged after the intended anchor advance; the keys were not found. Aborting."; exit 1
              fi
              git add .github/sync/pins.env
              git commit -m "advance nbase anchor to $ANCHOR_NEW_SHORT after reconciliation #infra"
              git push origin "$BR:refs/heads/$BR"
            fi
            # Build the PR body (printf keeps backticks literal and expands only %s args).
            B="$RUNNER_TEMP/pins-body.md"
            {
              printf '%s\n' 'Automated by `sync-land.yml` after fast-forwarding `origin/nbase` onto the reconciliation snapshot. This advances the anchor pins so `sync-guard-check` describes reality again on every branch.'
              printf '%s\n' ''
              printf '%s\n' '**This PR is gated by `sync-guard-check`.** It was created with `SYNC_TOKEN`, so the `pull_request` check actually runs on it; the run that opened it also polls and asserts that check reported here. Review confirms the evidence below rather than rubber-stamping opaque hex.'
              printf '%s\n' ''
              printf '%s\n' '| fact | value |'
              printf '%s\n' '| --- | --- |'
              printf '| previous `origin/nbase` (OLD_NBASE) | `%s` |\n' "$OLD_NBASE"
              printf '| new `origin/nbase` = snapshot | `%s` |\n' "$SNAP"
              printf '| new snapshot tree (OLD_NBASE_TREE) | `%s` |\n' "$SNAP_TREE"
              printf '| previously-pinned ANCHOR_SRC | `%s` |\n' "$PIN_ANCHOR"
              printf '| resolved upstream source (new ANCHOR_SRC) | `%s` |\n' "$ANCHOR_NEW"
              printf '| upstream source tree | `%s` |\n' "$SRC_TREE"
              printf '| snapshot tree == upstream source tree | `%s` |\n' "$TREES_MATCH"
              printf '%s\n' ''
              printf '%s\n' 'The snapshot tree equals the resolved upstream source tree, which proves `nbase` now carries a byte-identical copy of a real upstream commit that descends from the previous anchor. Verified live by `sync-guard.ps1 -LandCheckOnly` (self-tested) before `nbase` was moved. Only the three anchor pins change in this PR.'
            } > "$B"
            PR_URL=$(gh pr create --repo "$R" --base dev --head "$BR" \
              --title "advance nbase anchor after reconciliation" --body-file "$B")
            PRN=$(printf '%s' "$PR_URL" | grep -oE '[0-9]+$' | tail -n1)
            echo "opened pins PR #$PRN: $PR_URL"
          fi
          HEAD_SHA=$(git ls-remote origin "refs/heads/$BR" | cut -f1)
          { echo "pr_number=$PRN"; echo "branch=$BR"; echo "head_sha=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"

      - name: Assert sync-guard-check ran and passed on the pins PR head
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.head_sha }}
          PRN: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -e
          echo "waiting for sync-guard-check to report a pull_request run on $SHA (PR #$PRN) ..."
          deadline=$(( $(date +%s) + 900 ))
          conclusion=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run=$(gh api "repos/$R/actions/workflows/sync-guard-check.yml/runs?head_sha=$SHA&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | (.status) + " " + ((.conclusion) // "")' 2>/dev/null || true)
            status=$(printf '%s' "$run" | cut -d' ' -f1)
            concl=$(printf '%s' "$run" | cut -d' ' -f2)
            echo "  status=${status:-none} conclusion=${concl:-none}"
            if [ "$status" = "completed" ]; then conclusion="$concl"; break; fi
            sleep 30
          done
          if [ -z "$conclusion" ]; then
            echo "::error::sync-guard-check did not report a completed pull_request run on the pins PR head $SHA within the timeout."
            echo "::error::The pins PR is NOT verified as gated — do not merge it blindly. Investigate why the check did not run."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::sync-guard-check concluded '$conclusion' on the pins PR head $SHA."
            echo "::error::origin/nbase has ALREADY moved; the pins PR is red and must be fixed on the PC before merge."
            exit 1
          fi
          echo "sync-guard-check passed on the pins PR head $SHA. The pins PR is gated and green."

      - name: Summary
        env:
          SNAP: ${{ steps.snap.outputs.snapshot }}
          OLD_NBASE: ${{ steps.snap.outputs.old_nbase }}
          PRN: ${{ steps.pr.outputs.pr_number }}
          BR: ${{ steps.pr.outputs.branch }}
        run: |
          {
            echo "## sync-land complete"
            echo ""
            echo "- origin/nbase: \`$OLD_NBASE\` -> \`$SNAP\`"
            echo "- pins PR: #$PRN (branch \`$BR\`), gated by sync-guard-check (green)"
            echo ""
            echo "Review and merge the pins PR to close the red-guard window on every other branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on any failure
        if: failure()
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          HELPER_BOT_TARGET: ${{ secrets.HELPER_BOT_TARGET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SNAP: ${{ steps.snap.outputs.snapshot }}
          OLD_NBASE: ${{ steps.snap.outputs.old_nbase }}
          MOVED: ${{ steps.ff.outputs.nbase_at_snap }}
          PRN: ${{ steps.pr.outputs.pr_number }}
        run: |
          if [ -z "$HELPER_BOT_TOKEN" ] || [ -z "$HELPER_BOT_TARGET" ]; then
            echo "Telegram secrets unset; skipping notification."; exit 0
          fi
          if [ "$MOVED" = "1" ]; then
            TEXT="⚠️ Dazegram sync-land: origin/nbase has ALREADY advanced to ${SNAP} but a later step failed (pins PR or its guard-check). Do NOT re-run as if nothing happened.
          old nbase: ${OLD_NBASE}
          pins PR:   ${PRN:-not created}
          run: ${RUN_URL}
          Finish on the PC: confirm the pins PR is green, or repin by hand."
          else
            TEXT="⚠️ Dazegram sync-land blocked before moving nbase (snapshot resolution or land check). Nothing pushed.
          snapshot: ${SNAP:-unresolved}
          run: ${RUN_URL}
          Finish the reconciliation on the PC."
          fi
          curl -s "https://api.telegram.org/bot${HELPER_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${HELPER_BOT_TARGET}" \
            --data-urlencode "text=${TEXT}" >/dev/null || echo "notify failed (non-fatal)."
