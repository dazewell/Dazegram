name: Sync guard check

# Always-on required check for the sync guard. Runs on EVERY push and PR with no
# paths filter, on purpose. It proves, on every commit:
#
#   1. The guard self-tests — every validator can still both reject a bad input
#      and accept a good one — AND its manifests load and validate, AND every
#      protected pin still matches the current tree (a protected file changed
#      without repinning fails here, at PR time, instead of blocking every future
#      sync on drift).
#   2. sync-upstream.yml still invokes the guard, as an ACTIVE (uncommented) step,
#      BEFORE the push. A text search would pass on a commented-out call; this
#      inspects structure, so commenting the invocation out fails the check.
#   3. The full real-candidate path runs against the live manifests: a known-clean
#      candidate passes and a tampered one blocks. Exercising real Git extraction
#      is what catches a stale pin or an empty manifest that -SelfTestOnly alone
#      would miss.
#
# No `paths-ignore`: this repo was bitten by the process-rules workflow sitting disabled for
# weeks while every PR reported green — an absent or skipped check is
# indistinguishable from a passing one.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard-check:
    name: Guard self-test, wiring, and real fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test + manifest load + protected pins vs HEAD
        shell: pwsh
        run: |
          if (-not (Test-Path ./.github/sync/sync-guard.ps1)) { Write-Host '::error::sync-guard.ps1 is missing'; exit 1 }
          ./.github/sync/sync-guard.ps1 -SelfTestOnly -CheckPinsAgainst HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::guard self-test / pin check failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Workflow policy startup modes fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $basePins = Get-Content .github/sync/pins.env -Raw
          $emptyManifest = Join-Path $env:RUNNER_TEMP 'workflow-manifest-empty.tsv'
          $badHeaderManifest = Join-Path $env:RUNNER_TEMP 'workflow-manifest-bad-header.tsv'
          Set-Content -LiteralPath $emptyManifest -Value "path`tblob" -Encoding utf8
          Set-Content -LiteralPath $badHeaderManifest -Value "wrong`theader" -Encoding utf8

          function Write-Pins([string]$name, [string]$policyLine) {
            $path = Join-Path $env:RUNNER_TEMP $name
            $content = $basePins -replace '(?m)^WORKFLOW_POLICY=.*$', $policyLine
            Set-Content -LiteralPath $path -Value $content -NoNewline -Encoding utf8
            return $path
          }
          function Assert-FailsWith([string]$name, [hashtable]$arguments, [string]$pattern) {
            $out = (& ./.github/sync/sync-guard.ps1 @arguments *>&1 | Out-String -Width 8192)
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -eq 0) { Write-Host "::error::$name unexpectedly passed"; exit 1 }
            if ($out -notmatch $pattern) { Write-Host "::error::$name failed for the wrong reason (expected '$pattern')"; exit 1 }
          }

          $nonePins = Write-Pins 'pins-none.env' 'WORKFLOW_POLICY=none'
          ./.github/sync/sync-guard.ps1 -SelfTestOnly -CheckPinsAgainst HEAD -PinsFile $nonePins -WorkflowManifest $emptyManifest
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::none policy failed to initialize with an empty manifest'; exit 1 }

          $manifestPins = Write-Pins 'pins-manifest.env' 'WORKFLOW_POLICY=manifest'
          Assert-FailsWith 'manifest with empty manifest' @{
            SelfTestOnly = $true; PinsFile = $manifestPins; WorkflowManifest = $emptyManifest
          } 'manifest requires a non-empty'
          $unknownPins = Write-Pins 'pins-unknown.env' 'WORKFLOW_POLICY=unknown'
          Assert-FailsWith 'unknown workflow policy' @{
            SelfTestOnly = $true; PinsFile = $unknownPins; WorkflowManifest = $emptyManifest
          } 'unknown or malformed'
          $missingPins = Join-Path $env:RUNNER_TEMP 'pins-missing-policy.env'
          Set-Content -LiteralPath $missingPins -Value ($basePins -replace '(?m)^WORKFLOW_POLICY=.*\r?\n?', '') -NoNewline -Encoding utf8
          Assert-FailsWith 'missing workflow policy' @{
            SelfTestOnly = $true; PinsFile = $missingPins; WorkflowManifest = $emptyManifest
          } 'missing/empty: WORKFLOW_POLICY'
          Assert-FailsWith 'malformed workflow manifest header' @{
            SelfTestOnly = $true; PinsFile = $nonePins; WorkflowManifest = $badHeaderManifest
          } 'header must be exactly'
          exit 0

      - name: Production workflows use trusted guard config; guard precedes sync push
        shell: pwsh
        run: |
          $wf = './.github/workflows/sync-upstream.yml'
          if (-not (Test-Path $wf)) { Write-Host '::error::sync-upstream.yml is missing'; exit 1 }
          $lines = Get-Content $wf
          # Skip full-line comments, so a commented-out invocation is NOT counted.
          $guardLine = -1; $pushLine = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $t = $lines[$i].TrimStart()
            if ($t.StartsWith('#')) { continue }
            if ($guardLine -lt 0 -and $t -match 'sync-guard\.ps1') { $guardLine = $i }
            if ($pushLine  -lt 0 -and $t -match 'git push --atomic') { $pushLine = $i }
          }
          if ($guardLine -lt 0) { Write-Host '::error::no ACTIVE sync-guard.ps1 invocation in sync-upstream.yml (commented out?)'; exit 1 }
          if ($pushLine  -lt 0) { Write-Host '::error::no ACTIVE atomic push in sync-upstream.yml'; exit 1 }
          if ($guardLine -ge $pushLine) { Write-Host '::error::the guard is invoked AFTER the push, not before'; exit 1 }
          # The guard must still receive its candidate, and the dispatch must stay
          # input-less (no branch selector, no bypass flag). Search active text only.
          $active = (($lines | Where-Object { -not $_.TrimStart().StartsWith('#') }) -join "`n")
          foreach ($p in '-PreRef', '-OldNbase', '-NewSnapshot', '-NewSrc', '-NewDev') {
            if ($active -notmatch [regex]::Escape($p)) { Write-Host "::error::guard no longer receives $p"; exit 1 }
          }
          if ($active -notmatch 'workflow_dispatch:\s*\{\s*\}') { Write-Host '::error::workflow_dispatch is no longer input-less'; exit 1 }
          if ($active -match '(?m)^\s*inputs:') { Write-Host '::error::sync-upstream.yml declares workflow inputs; none are allowed'; exit 1 }
          # Fixture/config overrides must never enter the production sync. The guard
          # reads the reviewed policy and manifests from the trusted PRE checkout.
          foreach ($override in '-AnchorOverride', '-PinsFile', '-ProtectedFile', '-WorkflowManifest') {
            if ($active -match [regex]::Escape($override)) { Write-Host "::error::sync-upstream.yml passes $override; test/config overrides must not appear in the real sync"; exit 1 }
          }
          $land = './.github/workflows/sync-land.yml'
          if (-not (Test-Path $land)) { Write-Host '::error::sync-land.yml is missing'; exit 1 }
          $landActive = ((Get-Content $land | Where-Object { -not $_.TrimStart().StartsWith('#') }) -join "`n")
          foreach ($override in '-AnchorOverride', '-PinsFile', '-ProtectedFile', '-WorkflowManifest') {
            if ($landActive -match [regex]::Escape($override)) { Write-Host "::error::sync-land.yml passes $override; test/config overrides must not appear in the real land path"; exit 1 }
          }
          Write-Host 'guard wiring intact: active invocation, before the push, input-less dispatch, trusted PRE policy/config only in sync and land paths.'

      - name: Full real-candidate fixture (clean passes, tampered/double-modified block)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.email 'guard-check@dazegram.local'
          git config user.name  'guard-check'
          $env:GIT_AUTHOR_NAME='guard-check'; $env:GIT_AUTHOR_EMAIL='guard-check@dazegram.local'
          $env:GIT_COMMITTER_NAME='guard-check'; $env:GIT_COMMITTER_EMAIL='guard-check@dazegram.local'

          function Pin($k) { (((Get-Content .github/sync/pins.env | Select-String "^$k=") -split '=', 2)[1]).Trim() }

          # This check is deliberately self-contained: it builds every fixture from
          # the live locally-authored origin/nbase and NEVER resolves or fetches the
          # configured source commit. To prove that independence rather than assert it, point the
          # `nagram` remote at an unreachable URL: if any path tried to reach upstream
          # the run would fail here.
          git remote add nagram https://invalid.invalid/does-not-exist.git 2>$null
          git remote set-url nagram https://invalid.invalid/does-not-exist.git

          # Fetch nbase and VERIFY the anchor is actually present and an ancestor —
          # actions/checkout is shallow-capable, and a fixture that silently can't
          # reach its anchor is this project's signature bug.
          git fetch --no-tags origin nbase
          $oldNbase = (git rev-parse origin/nbase).Trim()
          $pinNbase = Pin 'OLD_NBASE'
          if ($oldNbase -ne $pinNbase) { Write-Host "::error::origin/nbase $oldNbase != pinned OLD_NBASE $pinNbase"; exit 1 }
          git cat-file -e "$oldNbase^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::anchor $oldNbase not present after fetch (shallow?)"; exit 1 }
          git merge-base --is-ancestor $oldNbase origin/nbase
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::anchor $oldNbase is not an ancestor of origin/nbase"; exit 1 }

          # The fixture anchor is the fetched nbase itself; -AnchorOverride makes the
          # guard prove ancestry without resolving the configured source commit.
          $anchor   = $oldNbase
          $anchorTree = (git rev-parse "$anchor^{tree}").Trim()
          $head     = (git rev-parse HEAD).Trim()

          # NewSrc: a source commit descending from the anchor (parent = anchor), tree
          # = the anchor tree. A sibling of the snapshot, so it is not an ancestor of it.
          $newSrc = (git commit-tree $anchorTree -p $anchor -m "guard-check source #infra").Trim()
          $snap   = (git commit-tree $anchorTree -p $oldNbase -m "guard-check snapshot #infra").Trim()

          # Clean candidate: 3-way merge via plumbing (no branch switching).
          $mtOut = git merge-tree --write-tree $head $snap
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::fixture clean merge conflicted unexpectedly. If this branch was cut before the anchor merge landed, merge dev in first — the branch must contain the anchor merge.'
            Write-Host $mtOut; exit 1
          }
          $cleanTree = ($mtOut -split "`n")[0].Trim()
          $clean = (git commit-tree $cleanTree -p $head -p $snap -m "guard-check clean candidate #infra").Trim()

          Write-Host '--- running guard on KNOWN-CLEAN candidate (expect exit 0) ---'
          ./.github/sync/sync-guard.ps1 -PreRef $head -OldNbase $oldNbase -NewSnapshot $snap -NewSrc $newSrc -NewDev $clean -AnchorOverride $anchor
          $cleanExit = $LASTEXITCODE
          if ($cleanExit -ne 0) { Write-Host "::error::guard BLOCKED a known-clean candidate (exit $cleanExit)"; exit 1 }

          # Tampered candidate: swap the keystore blob for a throwaway blob. Build
          # the blob from a temp file — a pwsh stdin pipe to `git hash-object` does
          # not feed the process reliably and would leave the keystore unchanged.
          $badFile = Join-Path $env:RUNNER_TEMP 'gc-bad.bin'
          Set-Content -LiteralPath $badFile -Value ("tampered " + [guid]::NewGuid()) -NoNewline
          $badBlob = (git hash-object -w -- $badFile).Trim()
          $ksPath = Pin 'KEYSTORE_PATH'
          $idx = Join-Path $env:RUNNER_TEMP 'gc.idx'
          Remove-Item -LiteralPath $idx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $idx
          git read-tree $clean
          git update-index --cacheinfo "100644,$badBlob,$ksPath"
          $badTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $bad = (git commit-tree $badTree -p $head -p $snap -m "guard-check tampered candidate #infra").Trim()

          Write-Host '--- running guard on TAMPERED candidate (expect exit 1) ---'
          ./.github/sync/sync-guard.ps1 -PreRef $head -OldNbase $oldNbase -NewSnapshot $snap -NewSrc $newSrc -NewDev $bad -AnchorOverride $anchor
          $badExit = $LASTEXITCODE
          if ($badExit -eq 0) { Write-Host '::error::guard PASSED a tampered candidate (keystore swapped)'; exit 1 }

          # Double-modified candidate. The clean/tampered cases snapshot the anchor
          # tree, so OLD_NBASE..NEW_SNAPSHOT is empty and the fork-vs-upstream
          # intersection (the whole C2 guard) is never exercised. Here the snapshot
          # carries a GENUINE change to a file the fork also modified, so the parent
          # delta is non-empty and the guard must reject that path as DOUBLE-MODIFIED
          # specifically — an exit code alone could be right for the wrong reason.
          $protected = @(Get-Content .github/sync/protected-paths.tsv | Select-Object -Skip 1 | ForEach-Object { ($_ -split "`t")[0] })
          $anchorFiles = @{}; git ls-tree -r --name-only $anchor | ForEach-Object { $anchorFiles[$_] = $true }
          $forkMod = @(git diff --name-only $oldNbase $head | Where-Object { $anchorFiles.ContainsKey($_) -and $_ -notin $protected -and $_ -match '\.(java|kt)$' })
          if ($forkMod.Count -lt 1) { Write-Host '::error::no fork-modified non-protected file to build the double-modified fixture'; exit 1 }
          $F = $forkMod[0]
          Write-Host "double-modified fixture file: $F"

          # Upstream side: anchor's copy of F + a marker, snapshotted so the parent
          # delta genuinely contains F. NEW_SRC descends from the anchor.
          $srcModFile = Join-Path $env:RUNNER_TEMP 'gc-src'
          Set-Content -LiteralPath $srcModFile -Value (((git cat-file blob "${anchor}:$F") -join "`n") + "`n// guard-check upstream marker") -NoNewline
          $srcModBlob = (git hash-object -w -- $srcModFile).Trim()
          $sidx = Join-Path $env:RUNNER_TEMP 'gc-s.idx'; Remove-Item -LiteralPath $sidx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $sidx
          git read-tree $anchorTree; git update-index --cacheinfo "100644,$srcModBlob,$F"
          $srcModTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $newSrc2 = (git commit-tree $srcModTree -p $anchor -m "guard-check upstream bump #infra").Trim()
          $snap2   = (git commit-tree $srcModTree -p $oldNbase -m "guard-check bumped snapshot #infra").Trim()

          # Candidate: HEAD's copy of F + the same marker — the clean-merge outcome
          # (fork changes preserved, upstream marker applied). Built directly so the
          # fixture never depends on a merge that might conflict for an unrelated reason.
          $candModFile = Join-Path $env:RUNNER_TEMP 'gc-cand'
          Set-Content -LiteralPath $candModFile -Value (((git cat-file blob "${head}:$F") -join "`n") + "`n// guard-check upstream marker") -NoNewline
          $candModBlob = (git hash-object -w -- $candModFile).Trim()
          $cidx = Join-Path $env:RUNNER_TEMP 'gc-c.idx'; Remove-Item -LiteralPath $cidx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $cidx
          git read-tree $head; git update-index --cacheinfo "100644,$candModBlob,$F"
          $dblTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $dbl = (git commit-tree $dblTree -p $head -p $snap2 -m "guard-check double-modified candidate #infra").Trim()

          Write-Host '--- running guard on DOUBLE-MODIFIED candidate (expect exit 1, reason DOUBLE-MODIFIED) ---'
          # Capture ALL streams (*>&1): the guard reports via Write-Host, which 2>&1
          # does not capture, so the reason-string assertion below needs the merged
          # stream. -Width keeps the long path on one line so the match holds.
          $dblOut = (& ./.github/sync/sync-guard.ps1 -PreRef $head -OldNbase $oldNbase -NewSnapshot $snap2 -NewSrc $newSrc2 -NewDev $dbl -AnchorOverride $anchor *>&1 | Out-String -Width 8192)
          $dblExit = $LASTEXITCODE
          Write-Host $dblOut
          if ($dblExit -eq 0) { Write-Host '::error::guard PASSED a double-modified candidate'; exit 1 }
          if ($dblOut -notmatch 'DOUBLE-MODIFIED') { Write-Host '::error::guard blocked the double-modified candidate for the WRONG reason (no DOUBLE-MODIFIED)'; exit 1 }
          if ($dblOut -notmatch [regex]::Escape($F)) { Write-Host "::error::DOUBLE-MODIFIED did not name the expected file $F"; exit 1 }

          # Land-check enforces the same strict manifest contract as the real guard.
          # Build one clean topology, then vary only the snapshot/source workflow tree.
          $manifestLandBranch = 'manifest-land-fixture'
          $manifestLandRef = "refs/remotes/nagram/$manifestLandBranch"
          $manifestLandPins = Join-Path $env:RUNNER_TEMP 'gc-manifest-land-pins.env'

          # Keep manifest-policy coverage independent of the live parent. Build a
          # synthetic workflow-bearing source/snapshot and derive its manifest from
          # the fixture tree, so a workflow-free Telegram nbase does not weaken it.
          $fixtureWorkflowPath = '.github/workflows/fixture.yml'
          $fixtureWorkflowBlob = (git rev-parse "${head}:.github/workflows/ci.yml").Trim()
          $manifestIdx = Join-Path $env:RUNNER_TEMP 'gc-manifest-base.idx'
          Remove-Item -LiteralPath $manifestIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $manifestIdx
          git read-tree $anchorTree
          git update-index --add --cacheinfo "100644,$fixtureWorkflowBlob,$fixtureWorkflowPath"
          $manifestTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $headTree = (git rev-parse "$head^{tree}").Trim()
          $manifestAnchor = (git commit-tree $manifestTree -p $oldNbase -m "guard-check manifest anchor #infra").Trim()
          $manifestOld = (git commit-tree $manifestTree -p $oldNbase -m "guard-check manifest old nbase #infra").Trim()
          $manifestSrc = (git commit-tree $manifestTree -p $manifestAnchor -m "guard-check manifest source #infra").Trim()
          $manifestSnap = (git commit-tree $manifestTree -p $manifestOld -m "guard-check manifest snapshot #infra").Trim()
          $manifestPre = (git commit-tree $headTree -p $head -p $manifestOld -m "guard-check manifest pre #infra").Trim()
          $manifestDev = (git commit-tree $headTree -p $manifestPre -p $manifestSnap -m "guard-check manifest dev #infra").Trim()
          $manifestLandManifest = Join-Path $env:RUNNER_TEMP 'gc-manifest-land.tsv'
          $manifestRows = @("path`tblob")
          git ls-tree -r $manifestTree -- .github/workflows | ForEach-Object {
            if ($_ -notmatch "^\d+\s+blob\s+([0-9a-f]{40})`t(.+)$") {
              Write-Host "::error::malformed workflow fixture row: $_"; exit 1
            }
            $manifestRows += "$($Matches[2])`t$($Matches[1])"
          }
          Set-Content -LiteralPath $manifestLandManifest -Value $manifestRows -Encoding utf8

          $manifestLandPinText = Get-Content .github/sync/pins.env -Raw
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^ANCHOR_SRC=.*$', "ANCHOR_SRC=$manifestAnchor"
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^OLD_NBASE=.*$', "OLD_NBASE=$manifestOld"
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^OLD_NBASE_TREE=.*$', "OLD_NBASE_TREE=$manifestTree"
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^NAGRAM_BRANCH=.*$', "NAGRAM_BRANCH=$manifestLandBranch"
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^WORKFLOW_POLICY=.*$', 'WORKFLOW_POLICY=manifest'
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^SYNC_IDENTITY_NAME=.*$', 'SYNC_IDENTITY_NAME=guard-check'
          $manifestLandPinText = $manifestLandPinText -replace '(?m)^SYNC_IDENTITY_EMAIL=.*$', 'SYNC_IDENTITY_EMAIL=guard-check@dazegram.local'
          Set-Content -LiteralPath $manifestLandPins -Value $manifestLandPinText -NoNewline -Encoding utf8

          function Assert-ManifestLand([string]$name, [string]$source, [string]$snapshot, [string]$candidate, [string]$failurePattern) {
            git update-ref $manifestLandRef $source
            $out = (& ./.github/sync/sync-guard.ps1 -LandCheckOnly -OldNbase $manifestOld -NewSnapshot $snapshot -NewDev $candidate -PinsFile $manifestLandPins -WorkflowManifest $manifestLandManifest *>&1 | Out-String -Width 8192)
            $code = $LASTEXITCODE
            Write-Host "--- manifest land $name (exit $code) ---"
            Write-Host $out
            if (-not $failurePattern -and $code -ne 0) { Write-Host "::error::clean manifest land fixture failed"; exit 1 }
            if ($failurePattern -and $code -eq 0) { Write-Host "::error::manifest land $name unexpectedly passed"; exit 1 }
            if ($failurePattern -and $out -notmatch $failurePattern) { Write-Host "::error::manifest land $name failed for the wrong reason"; exit 1 }
          }

          Write-Host '--- running guard on MANIFEST-POLICY candidate (expect exit 0) ---'
          ./.github/sync/sync-guard.ps1 -PreRef $manifestPre -OldNbase $manifestOld -NewSnapshot $manifestSnap -NewSrc $manifestSrc -NewDev $manifestDev -AnchorOverride $manifestAnchor -PinsFile $manifestLandPins -WorkflowManifest $manifestLandManifest
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::guard blocked a manifest-policy candidate matching its exact workflow set'; exit 1 }

          Assert-ManifestLand 'clean' $manifestSrc $manifestSnap $manifestDev ''
          $debugPath = $fixtureWorkflowPath

          $changedIdx = Join-Path $env:RUNNER_TEMP 'gc-manifest-changed.idx'
          Remove-Item -LiteralPath $changedIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $changedIdx
          git read-tree $manifestTree
          git update-index --cacheinfo "100644,$badBlob,$debugPath"
          $changedTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $changedSrc = (git commit-tree $changedTree -p $manifestAnchor -m "guard-check manifest changed source #infra").Trim()
          $changedSnap = (git commit-tree $changedTree -p $manifestOld -m "guard-check manifest changed snapshot #infra").Trim()
          $changedDev = (git commit-tree $headTree -p $manifestPre -p $changedSnap -m "guard-check manifest changed dev #infra").Trim()
          Assert-ManifestLand 'changed' $changedSrc $changedSnap $changedDev 'workflow blob CHANGED'

          $addedIdx = Join-Path $env:RUNNER_TEMP 'gc-manifest-added.idx'
          Remove-Item -LiteralPath $addedIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $addedIdx
          git read-tree $manifestTree
          git update-index --add --cacheinfo "100644,$badBlob,.github/workflows/evil.yml"
          $addedTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $addedSrc = (git commit-tree $addedTree -p $manifestAnchor -m "guard-check manifest added source #infra").Trim()
          $addedSnap = (git commit-tree $addedTree -p $manifestOld -m "guard-check manifest added snapshot #infra").Trim()
          $addedDev = (git commit-tree $headTree -p $manifestPre -p $addedSnap -m "guard-check manifest added dev #infra").Trim()
          Assert-ManifestLand 'added' $addedSrc $addedSnap $addedDev 'workflow ADDED'

          $removedIdx = Join-Path $env:RUNNER_TEMP 'gc-manifest-removed.idx'
          Remove-Item -LiteralPath $removedIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $removedIdx
          git read-tree $manifestTree
          git ls-tree -r --name-only $manifestTree -- .github/workflows |
            ForEach-Object { git update-index --force-remove -- $_ }
          $removedTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $removedSrc = (git commit-tree $removedTree -p $manifestAnchor -m "guard-check manifest removed source #infra").Trim()
          $removedSnap = (git commit-tree $removedTree -p $manifestOld -m "guard-check manifest removed snapshot #infra").Trim()
          $removedDev = (git commit-tree $headTree -p $manifestPre -p $removedSnap -m "guard-check manifest removed dev #infra").Trim()
          Assert-ManifestLand 'removed' $removedSrc $removedSnap $removedDev 'approved workflow MISSING'

          # Future Telegram steady state: old nbase and its successor snapshot both
          # have no .github tree. Build that topology entirely from synthetic commits
          # and use the existing fixture-only AnchorOverride; production gets no
          # bootstrap mode or runtime policy selector. This is intentionally a
          # zero-delta fixture for policy startup + guard 5; the manifest fixture
          # above keeps the non-empty parent-delta coverage.
          $noneIdx = Join-Path $env:RUNNER_TEMP 'gc-none.idx'
          Remove-Item -LiteralPath $noneIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $noneIdx
          git read-tree $oldNbase
          git ls-tree -r --name-only $oldNbase -- .github |
            ForEach-Object { git update-index --force-remove -- $_ }
          $noneTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE

          $noneAnchor = (git commit-tree $noneTree -p $oldNbase -m "guard-check none anchor #infra").Trim()
          $noneOld = (git commit-tree $noneTree -p $oldNbase -m "guard-check none old nbase #infra").Trim()
          $noneSrc = (git commit-tree $noneTree -p $noneAnchor -m "guard-check none source #infra").Trim()
          $noneSnap = (git commit-tree $noneTree -p $noneOld -m "guard-check none snapshot #infra").Trim()
          $nonePre = (git commit-tree $headTree -p $noneOld -m "guard-check none pre #infra").Trim()
          $noneCandidate = (git commit-tree $headTree -p $nonePre -p $noneSnap -m "guard-check none candidate #infra").Trim()

          $noneManifest = Join-Path $env:RUNNER_TEMP 'gc-none-manifest.tsv'
          Set-Content -LiteralPath $noneManifest -Value "path`tblob" -Encoding utf8
          $nonePins = Join-Path $env:RUNNER_TEMP 'gc-none-pins.env'
          $nonePinText = Get-Content .github/sync/pins.env -Raw
          $nonePinText = $nonePinText -replace '(?m)^WORKFLOW_POLICY=.*$', 'WORKFLOW_POLICY=none'
          $nonePinText = $nonePinText -replace '(?m)^ANCHOR_SRC=.*$', "ANCHOR_SRC=$noneAnchor"
          $nonePinText = $nonePinText -replace '(?m)^OLD_NBASE=.*$', "OLD_NBASE=$noneOld"
          $nonePinText = $nonePinText -replace '(?m)^OLD_NBASE_TREE=.*$', "OLD_NBASE_TREE=$noneTree"
          $nonePinText = $nonePinText -replace '(?m)^NAGRAM_BRANCH=.*$', 'NAGRAM_BRANCH=none-land-fixture'
          $nonePinText = $nonePinText -replace '(?m)^SYNC_IDENTITY_NAME=.*$', 'SYNC_IDENTITY_NAME=guard-check'
          $nonePinText = $nonePinText -replace '(?m)^SYNC_IDENTITY_EMAIL=.*$', 'SYNC_IDENTITY_EMAIL=guard-check@dazegram.local'
          Set-Content -LiteralPath $nonePins -Value $nonePinText -NoNewline -Encoding utf8

          # A premature none flip must not let the no-op fast path bless a
          # workflow-bearing nbase just because source and nbase match. Keep this
          # synthetic so the check remains meaningful after the live nbase moves.
          $earlyNonePins = Join-Path $env:RUNNER_TEMP 'gc-none-early-pins.env'
          $earlyNonePinText = Get-Content .github/sync/pins.env -Raw
          $earlyNonePinText = $earlyNonePinText -replace '(?m)^WORKFLOW_POLICY=.*$', 'WORKFLOW_POLICY=none'
          $earlyNonePinText = $earlyNonePinText -replace '(?m)^ANCHOR_SRC=.*$', "ANCHOR_SRC=$manifestSrc"
          $earlyNonePinText = $earlyNonePinText -replace '(?m)^OLD_NBASE=.*$', "OLD_NBASE=$manifestSnap"
          $earlyNonePinText = $earlyNonePinText -replace '(?m)^OLD_NBASE_TREE=.*$', "OLD_NBASE_TREE=$manifestTree"
          Set-Content -LiteralPath $earlyNonePins -Value $earlyNonePinText -NoNewline -Encoding utf8
          $earlyNoneOut = (& ./.github/sync/sync-guard.ps1 -FastPathOnly -PreRef $manifestDev -OldNbase $manifestSnap -NewSrc $manifestSnap -PinsFile $earlyNonePins -WorkflowManifest $noneManifest *>&1 | Out-String -Width 8192)
          $earlyNoneExit = $LASTEXITCODE
          Write-Host $earlyNoneOut
          if ($earlyNoneExit -eq 0 -or $earlyNoneExit -eq 3) { Write-Host '::error::none policy fast path passed a workflow-bearing live nbase'; exit 1 }
          if ($earlyNoneOut -notmatch 'workflow forbidden under none policy') { Write-Host '::error::none policy fast path blocked for the wrong reason'; exit 1 }

          # In the intended future steady state, equal workflow-free trees remain
          # a clean no-op (exit 3), now after policy validation.
          $noneFastOut = (& ./.github/sync/sync-guard.ps1 -FastPathOnly -PreRef $nonePre -OldNbase $noneOld -NewSrc $noneSrc -PinsFile $nonePins -WorkflowManifest $noneManifest *>&1 | Out-String -Width 8192)
          $noneFastExit = $LASTEXITCODE
          Write-Host $noneFastOut
          if ($noneFastExit -ne 3) { Write-Host "::error::none policy workflow-free fast path expected exit 3, got $noneFastExit"; exit 1 }

          Write-Host '--- running guard on NONE-POLICY candidate with no .github tree (expect exit 0) ---'
          ./.github/sync/sync-guard.ps1 -PreRef $nonePre -OldNbase $noneOld -NewSnapshot $noneSnap -NewSrc $noneSrc -NewDev $noneCandidate -AnchorOverride $noneAnchor -PinsFile $nonePins -WorkflowManifest $noneManifest
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::guard blocked a none-policy candidate with zero workflows'; exit 1 }

          # Land-check shares the same startup path. Point the synthetic fixture
          # remote-tracking ref at the matching source commit so the full land
          # assertions run after none-mode initialization.
          git update-ref refs/remotes/nagram/none-land-fixture $noneSrc
          Write-Host '--- running LAND CHECK on NONE-POLICY snapshot (expect exit 0) ---'
          ./.github/sync/sync-guard.ps1 -LandCheckOnly -OldNbase $noneOld -NewSnapshot $noneSnap -NewDev $noneCandidate -PinsFile $nonePins -WorkflowManifest $noneManifest
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::none-policy land check failed'; exit 1 }

          # A single workflow path must fail under none, even when every other
          # fixture fact remains valid.
          $wfBlob = (git rev-parse "${head}:.github/workflows/ci.yml").Trim()
          $badNoneIdx = Join-Path $env:RUNNER_TEMP 'gc-none-bad.idx'
          Remove-Item -LiteralPath $badNoneIdx -ErrorAction SilentlyContinue
          $env:GIT_INDEX_FILE = $badNoneIdx
          git read-tree $noneTree
          git update-index --add --cacheinfo "100644,$wfBlob,.github/workflows/ci.yml"
          $badNoneTree = (git write-tree).Trim()
          Remove-Item Env:\GIT_INDEX_FILE
          $badNoneSrc = (git commit-tree $badNoneTree -p $noneAnchor -m "guard-check none bad source #infra").Trim()
          $badNoneSnap = (git commit-tree $badNoneTree -p $noneOld -m "guard-check none bad snapshot #infra").Trim()
          $badNoneCandidate = (git commit-tree $headTree -p $nonePre -p $badNoneSnap -m "guard-check none bad candidate #infra").Trim()
          $noneBadOut = (& ./.github/sync/sync-guard.ps1 -PreRef $nonePre -OldNbase $noneOld -NewSnapshot $badNoneSnap -NewSrc $badNoneSrc -NewDev $badNoneCandidate -AnchorOverride $noneAnchor -PinsFile $nonePins -WorkflowManifest $noneManifest *>&1 | Out-String -Width 8192)
          $noneBadExit = $LASTEXITCODE
          Write-Host $noneBadOut
          if ($noneBadExit -eq 0) { Write-Host '::error::none policy passed a snapshot containing a workflow'; exit 1 }
          if ($noneBadOut -notmatch 'workflow forbidden under none policy') { Write-Host '::error::none policy blocked for the wrong reason'; exit 1 }

          git update-ref refs/remotes/nagram/none-land-fixture $badNoneSrc
          $noneBadLandOut = (& ./.github/sync/sync-guard.ps1 -LandCheckOnly -OldNbase $noneOld -NewSnapshot $badNoneSnap -NewDev $badNoneCandidate -PinsFile $nonePins -WorkflowManifest $noneManifest *>&1 | Out-String -Width 8192)
          $noneBadLandExit = $LASTEXITCODE
          Write-Host $noneBadLandOut
          if ($noneBadLandExit -eq 0) { Write-Host '::error::none policy land check passed a snapshot containing a workflow'; exit 1 }
          if ($noneBadLandOut -notmatch 'workflow forbidden under none policy') { Write-Host '::error::none policy land check blocked for the wrong reason'; exit 1 }

          Write-Host 'fixture OK: manifest clean passed; tampered and double-modified blocked; none-policy fast path failed closed on workflows and passed on an empty tree; zero-workflow real candidate and land initialization passed; workflow-bearing real candidate and land check blocked.'
          # The blocking runs intentionally left $LASTEXITCODE=1; end the step green.
          exit 0
