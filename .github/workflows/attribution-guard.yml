name: Attribution guard

# Fails a PR if any commit in its range (base..head) carries AI/assistant
# attribution: a vendor name or bot identity as commit author/committer, a
# Co-authored-by trailer naming a vendor/bot, an authorship-attribution
# phrase in a commit message, or an AI-attribution phrase in an added
# Java/Kotlin/XML source line. This is the automated backstop for the
# no-AI-mentions rule the nagramx-workflow skill and CLAUDE.md already state
# in prose. See Tools/scripts/attribution_guard.py for the full design,
# including why it deliberately does NOT bare-keyword-scan commit messages
# or source code (this fork ships a real LLM feature that legitimately
# mentions these vendors as product functionality).
#
# This is a range guard, not a full-history scan: the fork's history already
# legitimately contains all of upstream Telegram's (and prior lineage's)
# commits, so scanning everything would be meaningless noise and would also
# make every PR fail on pre-existing history it didn't introduce.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: No AI/assistant attribution in range
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run attribution guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # A shallow default checkout can leave the base ref unreachable even
          # with fetch-depth: 0 on some runners/mirrors; fetch it explicitly so
          # a missing base fails on a real "cannot resolve", not a silent
          # empty range. The guard itself fails closed either way.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" || true

          # Run the guard code from the trusted BASE ref, not the checked-out
          # PR working tree: actions/checkout on a pull_request event defaults
          # to the head/merge ref, so a PR that edits or guts the guard's own
          # detection logic would otherwise get to grade its own homework.
          #
          # Fail closed if the base COMMIT itself can't be verified locally
          # (a fetch failure, an unreachable base SHA) -- that must not be
          # treated the same as the one legitimate case where the base commit
          # exists but simply predates the script (the PR that introduces it).
          # Conflating the two would let a PR whose base fetch silently fails
          # fall back to running its own, potentially-tampered copy: exactly
          # the bypass this trusted-ref fetch exists to close.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::cannot verify base commit $BASE_SHA locally; failing closed" >&2
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:Tools/scripts/attribution_guard.py" 2>/dev/null; then
            git show "$BASE_SHA:Tools/scripts/attribution_guard.py" > /tmp/attribution_guard.py
            SCRIPT=/tmp/attribution_guard.py
          else
            SCRIPT=Tools/scripts/attribution_guard.py
          fi
          python "$SCRIPT" --base "$BASE_SHA" --head "$HEAD_SHA"
